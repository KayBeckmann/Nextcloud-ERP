services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextcloud}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-34}-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${NEXTCLOUD_HTTP_PORT:-8080}:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextcloud}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
    volumes:
      - nextcloud_data:/var/www/html
      - ../nextcloud/erp:/var/www/html/custom_apps/erp
      # Offizielle Images enthalten kein tests/-Verzeichnis (Prod-Image).
      # Für lokale PHPUnit-Integrationstests wird der Server-Testbootstrap
      # per Sparse-Checkout nachgezogen, siehe docker/README.md.
      - ./.nc-server-tests/src/tests:/var/www/html/tests:ro

volumes:
  db_data:
  nextcloud_data:
