# Ausschließlich lokale Entwicklungs-/Testinstanz. Es gibt bewusst keine
# produktive Compose-Datei in diesem Repository.
name: nextcloud-erp-dev

services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextcloud}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-34}-apache
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Nie an alle Interfaces binden: diese Instanz darf ausschließlich vom
      # Entwicklungsrechner erreichbar sein, niemals über LAN/Internet.
      - "127.0.0.1:${NEXTCLOUD_HTTP_PORT:-8080}:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextcloud}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
    volumes:
      - nextcloud_data:/var/www/html
      - ../nextcloud/erp:/var/www/html/custom_apps/erp
      # Der optionale Server-Testbootstrap liegt bewusst NICHT in diesem
      # Standard-Compose: ein nicht vorhandener Bind-Mount würde von Docker
      # als leeres Host-Verzeichnis angelegt und blockiert anschließend beim
      # Image-Init /var/www/html/tests. Für PHPUnit ist die separate
      # docker-compose.tests.yml nach dem dokumentierten Sparse-Checkout
      # zu verwenden.

volumes:
  db_data:
  nextcloud_data:
