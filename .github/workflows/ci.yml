name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextcloud/erp
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer install (dev, for PHPUnit availability check only)
        run: composer install --no-interaction --no-progress

      - name: PHP lint
        run: find lib appinfo templates -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nextcloud/erp/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Build frontend
        run: npm run build

  app-tests:
    name: PHPUnit (against Nextcloud server)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: erp-app

      - name: Checkout Nextcloud server (stable34)
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: stable34
          submodules: recursive
          path: server

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: pgsql, pdo_pgsql, gd, zip, xml, mbstring, curl, intl
          tools: composer:v2

      - name: Link ERP app into server custom_apps
        run: |
          mkdir -p server/custom_apps
          cp -r erp-app/nextcloud/erp server/custom_apps/erp

      - name: Install ERP app composer dependencies
        working-directory: server/custom_apps/erp
        run: composer install --no-interaction --no-progress

      - name: Install Nextcloud
        working-directory: server
        run: |
          php occ maintenance:install \
            --database "pgsql" \
            --database-name "nextcloud" \
            --database-host "127.0.0.1" \
            --database-user "nextcloud" \
            --database-pass "nextcloud" \
            --admin-user "admin" \
            --admin-pass "admin"

      - name: Enable ERP app
        working-directory: server
        run: php occ app:enable erp

      - name: Provision ERP-Gruppen und Group Folder (ADR-0024)
        working-directory: server
        run: |
          php occ app:install groupfolders
          php occ group:add erp-projektleiter
          php occ group:add erp-monteure
          FOLDER_ID=$(php occ groupfolders:create "ERP-Firma")
          php occ groupfolders:group "$FOLDER_ID" erp-projektleiter read write share delete
          php occ groupfolders:group "$FOLDER_ID" erp-monteure read write

      - name: Run ERP PHPUnit suite
        working-directory: server/custom_apps/erp
        run: php vendor/bin/phpunit --configuration tests/phpunit.xml
