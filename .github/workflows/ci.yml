name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextcloud/erp
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer install (dev, for PHPUnit availability check only)
        run: composer install --no-interaction --no-progress

      - name: PHP lint
        run: find lib appinfo templates -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nextcloud/erp/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Build frontend
        run: npm run build

  app-tests:
    name: PHPUnit (against Nextcloud server)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: erp-app

      - name: Checkout Nextcloud server (stable34)
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: stable34
          submodules: recursive
          path: server

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pgsql, pdo_pgsql, gd, zip, xml, mbstring, curl, intl
          tools: composer:v2

      - name: Link ERP app into server apps
        run: |
          # "apps/" statt "custom_apps/": Nextclouds apps_paths kennt "apps/"
          # ohne weitere Konfiguration, "custom_apps/" nur beim offiziellen
          # Docker-Image (dort per config.php vorkonfiguriert) — bei einem
          # rohen Server-Checkout wie hier fehlt dieser Eintrag, wodurch
          # "occ app:enable erp" die App nicht findet und stattdessen (erfolglos)
          # im offiziellen App Store danach sucht.
          cp -r erp-app/nextcloud/erp server/apps/erp

      - name: Install ERP app composer dependencies
        working-directory: server/apps/erp
        run: composer install --no-interaction --no-progress

      - name: Install Nextcloud
        working-directory: server
        run: |
          php occ maintenance:install \
            --database "pgsql" \
            --database-name "nextcloud" \
            --database-host "127.0.0.1" \
            --database-user "nextcloud" \
            --database-pass "nextcloud" \
            --admin-user "admin" \
            --admin-pass "admin"

      - name: Enable files_external (core dependency for ErpFolderService)
        working-directory: server
        run: |
          # "occ maintenance:install" allein installiert/migriert
          # "files_external" nicht (anders als das offizielle Docker-Image,
          # das es standardmäßig aktiviert hat) — ohne das fehlt
          # "oc_external_mounts", und SetupManager::setupForUser() (über
          # ErpFolderService::erpRoot() in praktisch jedem Test) scheitert
          # mit "relation oc_external_mounts does not exist".
          php occ app:enable files_external

      - name: Enable ERP app
        working-directory: server
        run: php occ app:enable erp

      - name: Provision ERP-Gruppen und Group Folder (ADR-0024)
        working-directory: server
        run: |
          php occ app:install groupfolders
          php occ group:add erp-projektleiter
          php occ group:add erp-monteure
          # "tail -1": ohne pcntl-Extension (auf dem CI-Runner nicht
          # installiert, anders als im offiziellen Docker-Image) schreibt occ
          # eine PCNTL-Warnung mit auf stdout vor die eigentliche Ausgabe —
          # ungefiltert würde das die Folder-ID kaputt machen.
          FOLDER_ID=$(php occ groupfolders:create "ERP-Firma" | tail -1)
          php occ groupfolders:group "$FOLDER_ID" erp-projektleiter read write share delete
          php occ groupfolders:group "$FOLDER_ID" erp-monteure read write

      - name: Run ERP PHPUnit suite
        working-directory: server/apps/erp
        run: php vendor/bin/phpunit --configuration tests/phpunit.xml
